<?xml version="1.0" encoding="UTF-8"?>
<!--
  FanPitch — Stacked logo (mark on top, wordmark below)
  Best for square contexts (splash screen, social avatar).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="markGradS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#00A651"/>
      <stop offset="100%" stop-color="#FF6B2C"/>
    </linearGradient>
    <radialGradient id="markBallGlowS" cx="40%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8ECEF"/>
    </radialGradient>
  </defs>

  <g transform="translate(150,40)">
    <circle cx="250" cy="250" r="230" fill="url(#markGradS)"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.75">
      <path d="M 350,158 A 125,125 0 0 1 350,342"/>
      <path d="M 150,158 A 125,125 0 0 0 150,342" opacity="0.55"/>
    </g>
    <g opacity="0.18" stroke="#FFFFFF" stroke-width="3" fill="none">
      <circle cx="250" cy="250" r="173"/>
      <line x1="250" y1="77" x2="250" y2="423"/>
    </g>
    <circle cx="250" cy="250" r="106" fill="url(#markBallGlowS)"/>
    <path d="M 250,189 L 305,225 L 284,287 L 216,287 L 195,225 Z" fill="#0D1117"/>
    <g fill="none" stroke="#0D1117" stroke-width="5.5" stroke-linejoin="round">
      <path d="M 195,225 L 154,243"/>
      <path d="M 305,225 L 346,243"/>
      <path d="M 216,287 L 201,335"/>
      <path d="M 284,287 L 299,335"/>
      <path d="M 250,189 L 250,151"/>
    </g>
    <path d="M 338,283 A 106,106 0 0 1 283,338"
          fill="none" stroke="#FF6B2C" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  </g>

  <g transform="translate(400,780)" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" text-anchor="middle">
    <text x="0" y="0" font-size="150" fill="#0D1117" letter-spacing="-5">Fan<tspan fill="#00A651">P</tspan>itch</text>
    <text x="0" y="78" font-size="36" fill="#FF6B2C" letter-spacing="14" font-weight="600">REAL · TIME · FAN</text>
  </g>
</svg>
